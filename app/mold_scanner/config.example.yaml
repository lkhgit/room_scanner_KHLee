# Example settings for mold_simulator.py (original spec §7, revised spec §6.1). Copy to config.yaml in the session folder or this folder.
# Missing entries use the defaults. API keys go in kma.py, not here.

# station_id: 108            # ASOS station (Seoul 108). If left out, session.yaml's asos_station is used,
                             # and without that the station nearest the site that measures ground temperature
                             # if the site only has a name, its coordinates are looked up with the Kakao Local API
ground_depth_m: 1.0          # ground temperature depth: 0.5, 1.0, 1.5, 3.0, 5.0

# weather period of the simulation
period: year                 # year: one run per year / last365: the 365 days ending yesterday at 23:00
# sim_years: [2025]          # years for year mode. If left out, the last complete year. Years that have not ended are refused

# heating/cooling schedule - the defaults are only an example, adjust them to how the room is used
heating_months: [11, 12, 1, 2, 3]
cooling_months: [6, 7, 8, 9]
hvac_hours: ["18-23", "0-7"] # list of hours or "a-b" ranges
T_heat_set: 20.0             # °C
T_cool_set: 26.0             # °C

# outdoor air and ground temperature at scan time
outdoor_source: auto         # auto (ASOS first, then ultra-short-term observations) | asos | ncst
ground_lag_max_days: 3       # how many days back a ground temperature may come from when the scan day has none

# indoor moisture load (A1)
T_low: 0.0                   # break points of the g function, °C
T_high: 20.0
round_to_class: true         # when judged "measured", round dv_max to the nearest of {0,2,4,6,8,10} g/m3
g_min: 0.3
dv_max_override: null        # g/m3. If set, used instead of the measured value (in both scenarios)

# temperature factor f
f_override: {}               # e.g. {3: 0.62, 12: 0.8}
sd_max: 0.3                  # °C. A face/scan whose IR standard deviation is larger is left out

# uncertainty and judgment (revised spec §4). Whenever a value can be computed it is used, whatever its sigma
# the worst scenario uses f - 2 sigma_f and dv_max + 2 sigma (at most 10 g/m3)
sigma_ir: 0.5                # °C. Systematic IR error. After calibrating with sensor_test.ino, lower it to the calibrated RMSE
sigma_sht: 0.2               # °C. SHT41 temperature error
sigma_site: 0.3              # °C. Ground temperature difference between the station and the site
sigma_rh_in: 1.8             # %. SHT41 humidity error
sigma_rh_out: 5.0            # %. Outdoor humidity error (estimate, includes the grid/station difference)
sigma_beh: 1.0               # g/m3. Short-term swings in moisture from daily life such as cooking and showers
sigma_f_max: 0.10            # threshold for the judgment shown. Above it the face is marked "uncertain" and the measured value is still used
sigma_dv_max: 1.0            # g/m3. Threshold for the judgment shown (as above)
f_central: 0.75              # substitute f (central / worst) - only used when a face's f cannot be computed
f_low: 0.60
dv_central: 4.0              # substitute dv_max in g/m3 (central / worst) - only used without outdoor data or when g is all 0
dv_high: 6.0

# VTT
material_class: sensitive    # very_sensitive | sensitive | medium_resistant | resistant
material_by_face: {}         # e.g. {12: medium_resistant}. by_face in session.yaml takes precedence
C_mat: 0.5                   # decline coefficient: 1.0, 0.5, 0.25, 0.1
